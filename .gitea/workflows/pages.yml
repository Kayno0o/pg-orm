name: Deploy TypeDoc to Gitea Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: alpine
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: https://git.kevyn.fr/kaynooo/actions/postgres@v1
        with:
          database: orm_test

      - uses: https://git.kevyn.fr/kaynooo/actions/setup-bun@v1

      - name: Build pages
        run: |
          bun run doc
          bun run test:coverage

      - name: Combine docs and coverage
        run: |
          mkdir -p combined/docs combined/coverage
          cp -r typedoc/* combined/docs/
          cp -r coverage/* combined/coverage/

      - name: Deploy to gitea-pages branch
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: combined
          publish_branch: gitea-pages
          force_orphan: true
