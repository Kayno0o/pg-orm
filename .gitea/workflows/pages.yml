name: Deploy TypeDoc to Gitea Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: alpine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start PostgreSQL
        run: |
          # Cluster is pre-initialized in the runner image; just start + seed.
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test' SUPERUSER;\""
          su postgres -c "psql -c \"CREATE DATABASE orm_test OWNER test;\""
          # Verify connectivity
          PGPASSWORD=test psql -h 127.0.0.1 -U test -d orm_test -c "SELECT 1"

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build pages
        env:
          database_url: postgres://test:test@localhost:5432/orm_test
        run: |
          bun run doc
          bun run test:coverage

      - name: Combine docs and coverage
        run: |
          mkdir -p combined/docs combined/coverage
          cp -r docs/* combined/docs/
          cp -r coverage/* combined/coverage/

      - name: Deploy to gitea-pages branch
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: combined
          publish_branch: gitea-pages
          force_orphan: true
