name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

# The tests are not rerun here: the release waits for the CI run on main before the version bump.
jobs:
  publish:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: https://git.kevyn.fr/kaynooo/actions/setup-bun@v1

      - uses: https://git.kevyn.fr/kaynooo/actions/npm-publish@v1
        with:
          token: ${{ secrets.PACKAGE_TOKEN }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      # The changelog tool is the locked dev dependency, not whatever the registry serves as latest.
      - name: Generate changelog
        run: ./node_modules/.bin/changelogitea
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
