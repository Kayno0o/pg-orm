name: Publish to Forgejo Package Registry

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build package files
        run: bun run build

      - name: Configure npm authentication
        run: |
          echo "@kaynooo:registry=https://git.kaynooo.fr/api/packages/kaynooo/npm/" > ~/.npmrc
          echo "//git.kaynooo.fr/api/packages/kaynooo/npm/:_authToken=${PACKAGE_TOKEN}" >> ~/.npmrc
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      - name: Publish to Forgejo npm registry
        run: bun publish --access public --ignore-scripts
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

      # The registry token leaves the runner before any other tool runs.
      - name: Remove npm authentication
        if: always()
        run: rm -f ~/.npmrc

      # The changelog tool is the locked dev dependency, not whatever the registry serves as latest.
      - name: Generate changelog
        run: ./node_modules/.bin/changelogitea
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          DISCORD_WEBHOOK: ${{secrets.DISCORD_WEBHOOK}}
