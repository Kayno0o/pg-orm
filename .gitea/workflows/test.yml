name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
  pull_request:
    paths:
      - '**/*.ts'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Check circular dependencies
        run: bunx madge --circular ./src/index.ts

      - name: Typecheck
        run: bun run check

      - name: Typecheck examples
        run: bunx tsc --noEmit --strict --ignoreConfig examples/*.ts

      - name: Lint
        run: bun run lint:fix --dry-run 2>/dev/null || bunx eslint . --cache

  test:
    runs-on: alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and start PostgreSQL
        run: |
          apk add --no-cache postgresql postgresql-contrib
          mkdir -p /run/postgresql
          chown postgres:postgres /run/postgresql
          su postgres -c "initdb -D /var/lib/postgresql/data --auth-host=trust --auth-local=trust"
          su postgres -c "pg_ctl -D /var/lib/postgresql/data -o '-c listen_addresses=127.0.0.1 -c unix_socket_directories=/run/postgresql' -w start"
          # Wait for PostgreSQL to accept connections
          for i in $(seq 1 30); do su postgres -c "pg_isready" && break || sleep 1; done
          # Create test user and database
          su postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test';\""
          su postgres -c "psql -c \"CREATE DATABASE orm_test OWNER test;\""
          su postgres -c "psql -c \"ALTER USER test WITH SUPERUSER;\""
          # Verify connectivity
          PGPASSWORD=test psql -h 127.0.0.1 -U test -d orm_test -c "SELECT 1"

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        env:
          database_url: postgres://test:test@localhost:5432/orm_test
        run: bun test
