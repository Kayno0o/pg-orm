name: Tests

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and start PostgreSQL
        run: |
          apt-get update
          apt-get install -y postgresql postgresql-contrib
          service postgresql start
          # Wait for PostgreSQL to be ready
          until su - postgres -c "pg_isready"; do sleep 1; done
          # Create test user and database
          su - postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test';\""
          su - postgres -c "psql -c \"CREATE DATABASE orm_test OWNER test;\""
          su - postgres -c "psql -c \"ALTER USER test WITH SUPERUSER;\""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Run tests
        env:
          database_url: postgres://test:test@localhost:5432/orm_test
        run: bun test
