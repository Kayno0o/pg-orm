name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
  pull_request:
    paths:
      - '**/*.ts'
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Check circular dependencies
        run: bunx madge --circular ./src/index.ts

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint:fix --dry-run 2>/dev/null || bunx eslint . --cache

  test:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and start PostgreSQL
        run: |
          apt-get update
          apt-get install -y postgresql postgresql-contrib
          # Allow password-based local connections
          PG_HBA=$(find /etc/postgresql -name pg_hba.conf | head -1)
          sed -i 's/local\s\+all\s\+all\s\+peer/local all all md5/' "$PG_HBA"
          sed -i 's/host\s\+all\s\+all\s\+127.0.0.1\/32\s\+\(ident\|scram-sha-256\)/host all all 127.0.0.1\/32 md5/' "$PG_HBA"
          service postgresql start
          # Wait for PostgreSQL to accept connections
          for i in $(seq 1 30); do su - postgres -c "pg_isready" && break || sleep 1; done
          # Create test user and database
          su - postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test';\""
          su - postgres -c "psql -c \"CREATE DATABASE orm_test OWNER test;\""
          su - postgres -c "psql -c \"ALTER USER test WITH SUPERUSER;\""
          # Verify connectivity
          PGPASSWORD=test psql -h 127.0.0.1 -U test -d orm_test -c "SELECT 1"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project deps
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Run tests
        env:
          database_url: postgres://test:test@localhost:5432/orm_test
        run: bun test
