name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.ts'
      - bun.lock
      - package.json
      - tsconfig*.json
      - .gitea/workflows/test.yml
  pull_request:
    paths:
      - '**/*.ts'
      - bun.lock
      - package.json
      - tsconfig*.json
      - .gitea/workflows/test.yml
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: https://git.kevyn.fr/kaynooo/actions/setup-bun@v1

      - name: Check circular dependencies
        run: bunx madge --circular ./src/index.ts

      - name: Typecheck
        run: bun run check

      - name: Typecheck examples
        run: bunx tsc --noEmit --strict --skipLibCheck --ignoreConfig examples/*.ts

      - name: Lint
        run: bunx keslint .

  test:
    runs-on: alpine
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Passwords on TCP, for the test of a wrong one, as the docker-compose Postgres asks for them.
      - uses: https://git.kevyn.fr/kaynooo/actions/postgres@v1
        with:
          database: orm_test
          password-auth: true

      - uses: https://git.kevyn.fr/kaynooo/actions/setup-bun@v1

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test
