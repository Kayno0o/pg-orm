name: Benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: debian
    steps:
      - name: Install git before checkout
        run: apt-get update && apt-get install -y git unzip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and start PostgreSQL
        run: |
          apt-get update
          apt-get install -y postgresql postgresql-contrib
          service postgresql start
          until su - postgres -c "pg_isready"; do sleep 1; done
          su - postgres -c "psql -c \"CREATE USER test WITH PASSWORD 'test';\""
          su - postgres -c "psql -c \"CREATE DATABASE orm_test OWNER test;\""
          su - postgres -c "psql -c \"ALTER USER test WITH SUPERUSER;\""

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run benchmark
        run: bun benchmark.ts | tee output.txt
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/orm_test

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: benchmarkjs
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
