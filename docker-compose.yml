services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-orm-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orm_test
    ports:
      - '127.0.0.1:8532:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
