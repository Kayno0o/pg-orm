services:
  postgres:
    image: postgres:18-alpine
    container_name: pg-orm-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orm_test
    ports:
      - '127.0.0.1:8532:5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready -U test]
      interval: 5s
      timeout: 5s
      retries: 5
